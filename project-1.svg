<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p1-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#p1-bg)"/>
  
  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b"/>
  <rect x="0" y="30" width="600" height="12" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <rect x="100" y="10" width="400" height="22" rx="6" fill="#0f172a" opacity="0.6"/>
  <text x="300" y="25" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">taskpulse.kapish.app</text>

  <!-- Sidebar -->
  <rect x="20" y="60" width="130" height="300" rx="8" fill="#1e293b" opacity="0.6"/>
  <rect x="35" y="80" width="100" height="12" rx="4" fill="#6366f1" />
  <rect x="35" y="110" width="80" height="8" rx="4" fill="#64748b" opacity="0.5"/>
  <rect x="35" y="130" width="90" height="8" rx="4" fill="#64748b" opacity="0.5"/>
  <rect x="35" y="150" width="70" height="8" rx="4" fill="#64748b" opacity="0.5"/>
  <rect x="35" y="180" width="85" height="26" rx="6" fill="url(#accent-purple)" opacity="0.8"/>
  <text x="77" y="197" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">+ New Task</text>

  <!-- Main Kanban Board -->
  <!-- Column 1: To Do -->
  <rect x="170" y="60" width="125" height="300" rx="8" fill="#1e293b" opacity="0.4"/>
  <text x="180" y="85" fill="#94a3b8" font-size="12" font-weight="bold" font-family="sans-serif">TODO (3)</text>
  <rect x="180" y="100" width="105" height="60" rx="6" fill="url(#p1-card)" stroke="#334155" stroke-width="1"/>
  <rect x="190" y="115" width="70" height="8" rx="2" fill="#e2e8f0" />
  <rect x="190" y="130" width="45" height="6" rx="2" fill="#ef4444" opacity="0.7"/>
  
  <rect x="180" y="170" width="105" height="60" rx="6" fill="url(#p1-card)" stroke="#334155" stroke-width="1"/>
  <rect x="190" y="185" width="80" height="8" rx="2" fill="#e2e8f0" />
  <rect x="190" y="200" width="50" height="6" rx="2" fill="#06b6d4" opacity="0.7"/>

  <!-- Column 2: In Progress -->
  <rect x="310" y="60" width="125" height="300" rx="8" fill="#1e293b" opacity="0.4"/>
  <text x="320" y="85" fill="#06b6d4" font-size="12" font-weight="bold" font-family="sans-serif">PROGRESS (2)</text>
  <rect x="320" y="100" width="105" height="75" rx="6" fill="url(#p1-card)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="330" y="115" width="75" height="8" rx="2" fill="#e2e8f0" />
  <rect x="330" y="130" width="85" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="330" y="150" width="40" height="12" rx="4" fill="#6366f1" opacity="0.8"/>
  <text x="350" y="159" fill="#ffffff" font-size="8" font-family="sans-serif" text-anchor="middle">Dev</text>

  <!-- Column 3: Completed -->
  <rect x="450" y="60" width="125" height="300" rx="8" fill="#1e293b" opacity="0.4"/>
  <text x="460" y="85" fill="#10b981" font-size="12" font-weight="bold" font-family="sans-serif">DONE (4)</text>
  <rect x="460" y="100" width="105" height="55" rx="6" fill="url(#p1-card)" stroke="#10b981" stroke-width="1"/>
  <rect x="470" y="115" width="70" height="8" rx="2" fill="#10b981" opacity="0.9"/>
  <circle cx="550" cy="140" r="8" fill="#10b981" opacity="0.3"/>
  <text x="550" y="143" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
  
  <rect x="460" y="165" width="105" height="55" rx="6" fill="url(#p1-card)" stroke="#334155" stroke-width="1"/>
  <rect x="470" y="180" width="60" height="8" rx="2" fill="#94a3b8" opacity="0.8"/>
</svg>

