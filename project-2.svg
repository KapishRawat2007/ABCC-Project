    <text x="420" y="200" fill="#f59e0b" font-weight="bold">BALANCE</text>
    <line x1="45" y1="210" x2="555" y2="210" stroke="#334155" stroke-width="1"/>
    
    <text x="50" y="235" fill="#94a3b8">#10021</text>
    <text x="130" y="235" fill="#f8fafc">Kapish Rawat</text>
    <text x="310" y="235" fill="#06b6d4">PREMIUM SAVINGS</text>
    <text x="420" y="235" fill="#10b981">$ 48,250.00</text>

    <text x="50" y="265" fill="#94a3b8">#10022</text>
