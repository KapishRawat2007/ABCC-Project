      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#p2-bg)"/>
  
  <!-- Terminal Top Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b"/>
  <rect x="0" y="30" width="600" height="12" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="300" y="26" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">⚡ NovaBank_Core v2.4 [C++20 / g++ -O3]</text>

  <!-- Terminal Body -->
  <g font-family="'JetBrains Mono', monospace" font-size="13">
    <text x="30" y="75" fill="#10b981">kapish@system:~/novabank$</text>
