<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#p5-bg)"/>
  
  <!-- Browser Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b"/>
  <rect x="0" y="30" width="600" height="12" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="300" y="26" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">📊 AlgoVisualizer - Sorting &amp; Graph Explorer</text>

  <!-- Controls Bar -->
  <rect x="25" y="55" width="550" height="40" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="45" y="80" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Algorithm: QuickSort [O(N log N)]</text>
  <rect x="330" y="63" width="75" height="24" rx="4" fill="#a855f7"/>
  <text x="367" y="79" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">▶ Run</text>
  <rect x="415" y="63" width="75" height="24" rx="4" fill="#334155"/>
  <text x="452" y="79" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">↺ Reset</text>
  <rect x="500" y="63" width="65" height="24" rx="4" fill="#334155"/>
  <text x="532" y="79" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Step</text>

  <!-- Visualizer Bars Container -->
  <g transform="translate(40, 310)">
    <!-- Base line -->
    <line x1="0" y1="0" x2="520" y2="0" stroke="#334155" stroke-width="2" />

    <!-- Bars with heights -->
    <rect x="10" y="-80" width="22" height="80" rx="4" fill="#6366f1"/>
    <rect x="38" y="-140" width="22" height="140" rx="4" fill="#6366f1"/>
    <rect x="66" y="-60" width="22" height="60" rx="4" fill="#6366f1"/>
    <rect x="94" y="-180" width="22" height="180" rx="4" fill="#10b981"/> <!-- Sorted -->
    <rect x="122" y="-120" width="22" height="120" rx="4" fill="#10b981"/> <!-- Sorted -->
    <rect x="150" y="-195" width="22" height="195" rx="4" fill="#ef4444"/> <!-- Comparing/Pivot -->
    <rect x="178" y="-95" width="22" height="95" rx="4" fill="#ec4899"/>
    <rect x="206" y="-160" width="22" height="160" rx="4" fill="#ec4899"/>
    <rect x="234" y="-70" width="22" height="70" rx="4" fill="#6366f1"/>
    <rect x="262" y="-130" width="22" height="130" rx="4" fill="#6366f1"/>
    <rect x="290" y="-110" width="22" height="110" rx="4" fill="#6366f1"/>
    <rect x="318" y="-175" width="22" height="175" rx="4" fill="#f59e0b"/> <!-- Active partition -->
    <rect x="346" y="-85" width="22" height="85" rx="4" fill="#f59e0b"/>
    <rect x="374" y="-150" width="22" height="150" rx="4" fill="#6366f1"/>
    <rect x="402" y="-50" width="22" height="50" rx="4" fill="#6366f1"/>
    <rect x="430" y="-135" width="22" height="135" rx="4" fill="#6366f1"/>
    <rect x="458" y="-105" width="22" height="105" rx="4" fill="#6366f1"/>
    <rect x="486" y="-165" width="22" height="165" rx="4" fill="#6366f1"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 335)" font-family="sans-serif" font-size="11">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#ef4444"/>
    <text x="16" y="9" fill="#94a3b8">Pivot Element</text>
    
    <rect x="110" y="0" width="10" height="10" rx="2" fill="#ec4899"/>
    <text x="126" y="9" fill="#94a3b8">Comparing</text>

    <rect x="210" y="0" width="10" height="10" rx="2" fill="#10b981"/>
    <text x="226" y="9" fill="#94a3b8">Sorted Partition</text>

    <rect x="330" y="0" width="10" height="10" rx="2" fill="#6366f1"/>
    <text x="346" y="9" fill="#94a3b8">Unsorted Array</text>
  </g>
</svg>

