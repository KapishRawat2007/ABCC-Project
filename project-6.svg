    <text x="420" y="70" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">&lt;KR&gt;</text>
    <text x="420" y="120" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Kapish Rawat</text>
    <text x="420" y="138" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">BCA Undergrad • C/C++ • JS</text>
    
    <rect x="355" y="160" width="130" height="20" rx="4" fill="#1e293b"/>
