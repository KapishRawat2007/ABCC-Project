      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="16" fill="url(#p6-bg)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b"/>
  <rect x="0" y="30" width="600" height="12" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="300" y="26" fill="#818cf8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">✨ kapishrawat.dev - Portfolio v1.0</text>

  <!-- Hero Wireframe Mock -->
  <g transform="translate(40, 70)">
